# Build and behavior checks run on every pull request.
# Credential-bearing provider/Cloud tests are separately marked live.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build / package / import (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Install the built wheel
        run: pip install dist/*.whl

      - name: Import smoke test
        run: |
          python -c "import kumiho_memory; print('kumiho-memory', kumiho_memory.__version__)"

  tests:
    name: unit / regression (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      KUMIHO_RUN_LIVE_TESTS: "0"
      KUMIHO_RUN_CLOUD_TESTS: "0"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all]" pytest-timeout
      - name: Run all non-live tests
        run: >-
          python -m pytest -m "not live" --strict-markers
          --timeout=90 --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7
