# Publish kumiho-memory to PyPI via Trusted Publishing (OIDC).
#
# No stored secret: PyPI mints a short-lived token from the GitHub OIDC identity.
# Configure a "pending publisher" (or trusted publisher) on PyPI first:
#   PyPI project -> Settings -> Publishing -> Add a new publisher
#     Owner:          KumihoIO
#     Repository:     kumiho-memory
#     Workflow name:  publish.yml
#     Environment:    pypi
#
# Cut a release by bumping pyproject.toml + kumiho_memory/__init__.py to the
# same version, committing, then tagging:
#   git tag v0.20.0 && git push origin v0.20.0
name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine toml

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(python -c "import toml; print(toml.load('pyproject.toml')['project']['version'])")
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch — tag $TAG_VERSION != pyproject $PKG_VERSION"
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kumiho-memory/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing — no stored secret
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
